<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23030712'/%3E%3Cpath d='M22 18v28' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M30 22h16M30 28h16M30 34h12' stroke='%2360a5fa' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

  <title>Online Text Editor</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#338cf4;
      --panel:#ffffff;
      --text:#020929;
      --muted:#5b6070;
      --border:#d9d9d9;
      --shadow:rgba(7,20,35,0.2);
      --btn-bg:#ffffff;
      --btn-hover:#f3f6ff;
      --active:#e0e9ff;
      --editor-bg:#ffffff;
      --accent:#338cf4;
    }
    body.dark{
      --bg:#0b1220;
      --panel:rgba(255,255,255,0.06);
      --text:#eaf0ff;
      --muted:rgba(234,240,255,.75);
      --border:rgba(255,255,255,0.12);
      --shadow:rgba(0,0,0,0.45);
      --btn-bg:rgba(255,255,255,0.06);
      --btn-hover:rgba(255,255,255,0.10);
      --active:rgba(56,189,248,0.18);
      --editor-bg:rgba(255,255,255,0.04);
      --accent:#38bdf8;
    }

    body{
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .container{
      width:min(980px, 94vw);
      background:var(--panel);
      box-shadow:0 25px 50px var(--shadow);
      border:1px solid var(--border);
      border-radius:14px;
      padding:18px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand h2{font-size:18px;font-weight:700;letter-spacing:.2px}
    .brand .sub{font-size:12px;color:var(--muted)}

    .right-tools{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .pill{
      font-size:12px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      color:var(--muted);
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }

    .options{
      padding:12px 0;
      border-top:1px solid rgba(0,0,0,.08);
      border-bottom:1px solid rgba(0,0,0,.08);
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }
    body.dark .options{
      border-top:1px solid rgba(255,255,255,.08);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    button{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--btn-bg);
      color:var(--text);
      outline:none;
      cursor:pointer;
      transition:.12s ease;
    }
    button:hover{background:var(--btn-hover)}
    button:active{transform:scale(.97)}
    button.active{background:var(--active); border-color:rgba(56,189,248,.35)}

    select{
      padding:8px 10px;
      border:1px solid var(--border);
      background:var(--btn-bg);
      color:var(--text);
      border-radius:10px;
      cursor:pointer;
      outline:none;
      height:34px;
    }

    .input-wrapper{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--btn-bg);
      height:34px;
    }
    .input-wrapper label{font-size:12px;color:var(--muted)}

    input[type="color"]{
      -webkit-appearance:none;
      -moz-appearance:none;
      appearance:none;
      background:transparent;
      width:28px;
      height:22px;
      border:none;
      cursor:pointer;
    }
    input[type="color"]::-webkit-color-swatch{
      border-radius:999px;
      border:1px solid var(--border);
    }
    input[type="color"]::-moz-color-swatch{
      border-radius:999px;
      border:1px solid var(--border);
    }

    #text-input{
      margin-top:12px;
      border:1px solid var(--border);
      padding:18px;
      height:52vh;
      background:var(--editor-bg);
      color:var(--text);
      outline:none;
      border-radius:12px;
      line-height:1.65;
      overflow:auto;
      caret-color:var(--accent);
      word-wrap:break-word;
    }
    #text-input:empty:before{
      content:"Start typing here...";
      color:var(--muted);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      padding:10px 12px;
      border-radius:14px;
      background:rgba(5,10,20,.92);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(234,240,255,.9);
      box-shadow:0 18px 55px rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transition:.18s ease;
      font-size:13px;
      max-width:min(560px, calc(100vw - 28px));
      text-align:center;
      z-index:9999;
    }
    .toast.show{opacity:1}

    /* Find modal */
    #modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:99999;
      place-items:center;
      padding:16px;
    }
    .modal-card{
      width:min(520px,92vw);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 25px 50px var(--shadow);
      padding:14px;
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .modal-head b{font-size:14px}
    .modal-grid{display:grid;gap:10px}
    .modal-input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--btn-bg);
      color:var(--text);
      outline:none;
    }
    .modal-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .wide-btn{
      width:auto;
      padding:10px 12px;
      border-radius:12px;
    }
    .primary-wide{
      background:linear-gradient(90deg, rgba(56,189,248,.95), rgba(96,165,250,.95));
      border:none;
      color:#06101f;
      font-weight:700;
    }
    .modal-note{
      margin:10px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }

    @media (max-width:540px){
      .container{padding:14px}
      .options{gap:8px}
      button{width:32px;height:32px;border-radius:9px}
      select{height:32px}
      .input-wrapper{height:32px}
    }

    @media print{
      body{background:#fff}
      .container{position:static;transform:none;box-shadow:none;border:none;width:auto}
      .topbar,.options,.toast,#modal{display:none!important}
      #text-input{height:auto;border:none;padding:0}
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <h2>Online Text Editor</h2>
        <div class="sub">Format • Links • Colors • Auto-save (local)</div>
      </div>

      <div class="right-tools">
        <div class="pill" id="saveState"><i class="fa-solid fa-floppy-disk"></i><span>Saved</span></div>

        <button id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>

        <button id="findBtn" title="Find / Replace (Ctrl+F)" aria-label="Find Replace">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <div class="pill" id="counterPill">
          <i class="fa-solid fa-align-left"></i>
          <span id="counterText">0 words • 0 chars</span>
        </div>

        <button id="copyAll" title="Copy all text" aria-label="Copy all">
          <i class="fa-solid fa-copy"></i>
        </button>

        <button id="downloadTxt" title="Download .txt" aria-label="Download txt">
          <i class="fa-solid fa-file-arrow-down"></i>
        </button>

        <button id="downloadHtml" title="Download .html" aria-label="Download html">
          <i class="fa-brands fa-html5"></i>
        </button>

        <button id="printPdf" title="Print / Save as PDF" aria-label="Print PDF">
          <i class="fa-solid fa-file-pdf"></i>
        </button>

        <button id="clearAll" title="Clear editor" aria-label="Clear editor">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="options">
      <button id="bold" class="option-button format" title="Bold" aria-label="Bold">
        <i class="fa-solid fa-bold"></i>
      </button>

      <button id="italic" class="option-button format" title="Italic" aria-label="Italic">
        <i class="fa-solid fa-italic"></i>
      </button>

      <button id="underline" class="option-button format" title="Underline" aria-label="Underline">
        <i class="fa-solid fa-underline"></i>
      </button>

      <button id="superscript" class="option-button script" title="Superscript">
        <i class="fa-solid fa-superscript"></i>
      </button>

      <button id="subscript" class="option-button script" title="Subscript">
        <i class="fa-solid fa-subscript"></i>
      </button>

      <button id="insertOrderedList" class="option-button list" title="Ordered list">
        <i class="fa-solid fa-list-ol"></i>
      </button>

      <button id="insertUnorderedList" class="option-button list" title="Unordered list">
        <i class="fa-solid fa-list-ul"></i>
      </button>

      <button id="undo" class="option-button" title="Undo">
        <i class="fa-solid fa-rotate-left"></i>
      </button>

      <button id="redo" class="option-button" title="Redo">
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <button id="createLink" class="adv-option-button" title="Insert link (Ctrl+K)">
        <i class="fa-solid fa-link"></i>
      </button>

      <button id="unlink" class="option-button" title="Remove link">
        <i class="fa-solid fa-unlink"></i>
      </button>

      <button id="justifyLeft" class="option-button align" title="Align left">
        <i class="fa-solid fa-align-left"></i>
      </button>

      <button id="justifyCenter" class="option-button align" title="Align center">
        <i class="fa-solid fa-align-center"></i>
      </button>

      <button id="justifyRight" class="option-button align" title="Align right">
        <i class="fa-solid fa-align-right"></i>
      </button>

      <button id="justifyFull" class="option-button align" title="Justify">
        <i class="fa-solid fa-align-justify"></i>
      </button>

      <button id="indent" class="option-button spacing" title="Indent">
        <i class="fa-solid fa-indent"></i>
      </button>

      <button id="outdent" class="option-button spacing" title="Outdent">
        <i class="fa-solid fa-outdent"></i>
      </button>

      <select id="formatBlock" class="adv-option-button" title="Heading">
        <option value="P">P</option>
        <option value="H1">H1</option>
        <option value="H2">H2</option>
        <option value="H3">H3</option>
        <option value="H4">H4</option>
        <option value="H5">H5</option>
        <option value="H6">H6</option>
      </select>

      <select id="fontName" class="adv-option-button" title="Font"></select>
      <select id="fontSize" class="adv-option-button" title="Size"></select>

      <div class="input-wrapper" title="Font color">
        <input type="color" id="foreColor" class="adv-option-button" value="#000000">
        <label for="foreColor">Font</label>
      </div>

      <div class="input-wrapper" title="Highlight color">
        <input type="color" id="backColor" class="adv-option-button" value="#ffff00">
        <label for="backColor">Highlight</label>
      </div>
    </div>

    <div id="text-input" contenteditable="true"></div>
  </div>

  <!-- Find & Replace Modal -->
  <div id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Find and replace">
      <div class="modal-head">
        <b>Find & Replace</b>
        <button id="closeModal" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-grid">
        <input id="findInput" class="modal-input" placeholder="Find…">
        <input id="replaceInput" class="modal-input" placeholder="Replace with…">

        <label style="display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;">
          <input id="matchCase" type="checkbox" style="width:16px;height:16px;accent-color:var(--accent);">
          Match case
        </label>

        <div class="modal-actions">
          <button id="findNext" class="wide-btn">Find next</button>
          <button id="replaceOne" class="wide-btn">Replace</button>
          <button id="replaceAll" class="wide-btn primary-wide">Replace all</button>
        </div>
      </div>

      <p class="modal-note">
        Shortcuts: <b>Ctrl+F</b> Find • <b>Ctrl+K</b> Link • <b>Ctrl+B</b> Bold • <b>Ctrl+I</b> Italic • <b>Ctrl+U</b> Underline • <b>Esc</b> Close
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = s => document.querySelector(s);

    const optionsButtons = document.querySelectorAll('.option-button');
    const advancedOptions = document.querySelectorAll('.adv-option-button');

    const fontName = $("#fontName");
    const fontSizeRef = $("#fontSize");
    const writingArea = $("#text-input");

    const alignButtons = document.querySelectorAll('.align');
    const spacingButtons = document.querySelectorAll('.spacing');
    const formatButtons = document.querySelectorAll('.format');
    const scriptButtons = document.querySelectorAll('.script');

    const linkButton = $("#createLink");
    const themeToggle = $("#themeToggle");
    const saveState = $("#saveState");
    const toast = $("#toast");

    const findBtn = $("#findBtn");
    const counterText = $("#counterText");

    const modal = $("#modal");
    const closeModal = $("#closeModal");
    const findInput = $("#findInput");
    const replaceInput = $("#replaceInput");
    const matchCase = $("#matchCase");
    const findNextBtn = $("#findNext");
    const replaceOneBtn = $("#replaceOne");
    const replaceAllBtn = $("#replaceAll");

    const STORAGE_KEY = "ultra_editor_content_v3";
    const THEME_KEY   = "ultra_editor_theme_v1";

    const fontList = [
      "Poppins","Arial","Verdana","Times New Roman","Garamond","Georgia","Courier New","Cursive"
    ];

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast.t);
      showToast.t = setTimeout(()=>toast.classList.remove("show"), 1300);
    }

    // Save/restore selection for link/find actions
    let savedRange = null;

    function saveSelection(){
      const sel = window.getSelection();
      if(sel && sel.rangeCount > 0){
        const r = sel.getRangeAt(0);
        if(writingArea.contains(r.commonAncestorContainer)) savedRange = r;
      }
    }
    function restoreSelection(){
      const sel = window.getSelection();
      if(!sel || !savedRange) return;
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }

    // Track selection changes (only if inside editor)
    document.addEventListener("selectionchange", () => {
      const sel = window.getSelection();
      if(!sel || sel.rangeCount === 0) return;
      const r = sel.getRangeAt(0);
      if(writingArea.contains(r.commonAncestorContainer)) savedRange = r;
    });

    // Prevent toolbar from stealing selection/caret
    document.querySelectorAll(".options button, .options select, .options input, .right-tools button").forEach(el => {
      el.addEventListener("mousedown", (e) => {
        if(modal.contains(e.target)) return; // don't interfere with modal inputs/buttons
        e.preventDefault(); // keep caret in editor
      });
    });

    // execCommand wrapper (formatBlock expects tags)
    function modifyText(command, defaultUi, value){
      try{
        if(command === "formatBlock" && value){
          document.execCommand(command, defaultUi, `<${value}>`);
          return;
        }
        document.execCommand(command, defaultUi, value);
      }catch(e){
        showToast("Command not supported in this browser.");
      }
    }

    // Active state sync
    function updateActiveStates(){
      const cmds = [
        "bold","italic","underline",
        "superscript","subscript",
        "justifyLeft","justifyCenter","justifyRight","justifyFull",
        "insertOrderedList","insertUnorderedList"
      ];
      cmds.forEach(cmd=>{
        const btn = document.getElementById(cmd);
        if(!btn) return;
        try{
          document.queryCommandState(cmd) ? btn.classList.add("active") : btn.classList.remove("active");
        }catch(e){}
      });
    }

    function highlighter(buttons, needsRemoval){
      buttons.forEach(button=>{
        button.addEventListener("click", ()=>{
          restoreSelection();
          writingArea.focus({preventScroll:true});

          if(needsRemoval){
            const active = button.classList.contains("active");
            buttons.forEach(b=>b.classList.remove("active"));
            if(!active) button.classList.add("active");
          }else{
            button.classList.toggle("active");
          }

          saveSelection();
          updateActiveStates();
          scheduleSave();
          updateCounter();
        });
      });
    }

    // Theme
    function applyTheme(theme){
      document.body.classList.toggle("dark", theme === "dark");
      localStorage.setItem(THEME_KEY, theme);

      const icon = themeToggle?.querySelector("i");
      if(icon){
        icon.classList.remove("fa-moon","fa-sun");
        icon.classList.add(theme === "dark" ? "fa-sun" : "fa-moon");
      }
    }
    function initTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved) return applyTheme(saved);
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(prefersDark ? "dark" : "light");
    }

    // Autosave
    let saveTimer = null;
    let dirty = false;

    function setSavedState(state){
      if(state === "saving"){
        saveState.innerHTML = '<i class="fa-solid fa-floppy-disk"></i><span>Saving…</span>';
      }else{
        saveState.innerHTML = '<i class="fa-solid fa-floppy-disk"></i><span>Saved</span>';
      }
    }

    function saveContent(){
      if(!dirty) return;
      setSavedState("saving");
      localStorage.setItem(STORAGE_KEY, writingArea.innerHTML);
      dirty = false;
      setSavedState("saved");
    }

    function scheduleSave(){
      dirty = true;
      setSavedState("saving");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveContent, 350);
    }

    function restoreContent(){
      writingArea.innerHTML = localStorage.getItem(STORAGE_KEY) || "";
    }

    // Counter
    function updateCounter(){
      if(!counterText) return;
      const raw = writingArea.innerText || "";
      const trimmed = raw.replace(/\s+/g," ").trim();
      const words = trimmed ? trimmed.split(" ").length : 0;
      const chars = raw.length;
      counterText.textContent = `${words} words • ${chars} chars`;
    }

    // Download helper
    function download(filename, text, type="text/plain"){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type}));
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    }

    // Modal
    function openModal(){
      modal.style.display = "grid";
      modal.setAttribute("aria-hidden","false");
      findInput.focus();
    }
    function closeModalFn(){
      modal.style.display = "none";
      modal.setAttribute("aria-hidden","true");
      writingArea.focus();
    }

    // Find next (selection-based search in plain text)
    function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

    function selectByTextIndex(start, end){
      const walker = document.createTreeWalker(writingArea, NodeFilter.SHOW_TEXT, null);
      let node, idx = 0;
      let startNode=null, endNode=null, startOff=0, endOff=0;

      while((node = walker.nextNode())){
        const len = node.nodeValue.length;
        if(!startNode && idx + len >= start){
          startNode = node;
          startOff = start - idx;
        }
        if(idx + len >= end){
          endNode = node;
          endOff = end - idx;
          break;
        }
        idx += len;
      }

      if(startNode && endNode){
        const range = document.createRange();
        range.setStart(startNode, startOff);
        range.setEnd(endNode, endOff);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        writingArea.focus();
        saveSelection();
      }
    }

    function findNext(){
      const q = findInput.value || "";
      if(!q) return showToast("Type something to find.");

      const flags = matchCase.checked ? "g" : "gi";
      const text = writingArea.innerText || "";
      const re = new RegExp(escapeRegExp(q), flags);

      const sel = window.getSelection();
      let startIndex = 0;
      if(sel && sel.rangeCount){
        const range = sel.getRangeAt(0);
        const pre = range.cloneRange();
        pre.selectNodeContents(writingArea);
        pre.setEnd(range.endContainer, range.endOffset);
        startIndex = pre.toString().length;
      }

      re.lastIndex = startIndex;
      let m = re.exec(text);
      if(!m){
        re.lastIndex = 0;
        m = re.exec(text);
        if(!m) return showToast("Not found.");
      }

      selectByTextIndex(m.index, m.index + m[0].length);
      showToast("Found");
    }

    function replaceAllPreserveFormatting(findStr, replaceStr, caseSensitive){
      const walker = document.createTreeWalker(writingArea, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      let n;
      while((n = walker.nextNode())) nodes.push(n);

      if(!findStr) return 0;

      const flags = caseSensitive ? "g" : "gi";
      const re = new RegExp(escapeRegExp(findStr), flags);
      let count = 0;

      nodes.forEach(node => {
        const before = node.nodeValue;
        const after = before.replace(re, () => {
          count++;
          return replaceStr;
        });
        if(after !== before) node.nodeValue = after;
      });

      return count;
    }

    function replaceOne(){
      const q = findInput.value || "";
      if(!q) return showToast("Type something to find.");

      const sel = window.getSelection();
      if(sel && sel.toString()){
        const replacement = replaceInput.value || "";
        document.execCommand("insertText", false, replacement);
        scheduleSave();
        updateCounter();
        showToast("Replaced");
      }else{
        findNext();
      }
    }

    function replaceAll(){
      const q = findInput.value || "";
      if(!q) return showToast("Type something to find.");

      const replacement = replaceInput.value || "";
      const count = replaceAllPreserveFormatting(q, replacement, matchCase.checked);

      if(!count) return showToast("Not found.");
      scheduleSave();
      updateCounter();
      showToast(`Replaced ${count}`);
    }

    function initializer(){
      highlighter(alignButtons, true);
      highlighter(spacingButtons, true);
      highlighter(formatButtons, false);
      highlighter(scriptButtons, true);

      fontName.innerHTML = "";
      fontList.forEach(v=>{
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        fontName.appendChild(o);
      });

      fontSizeRef.innerHTML = "";
      for(let i=1;i<=7;i++){
        const o = document.createElement("option");
        o.value = i;
        o.textContent = i;
        fontSizeRef.appendChild(o);
      }
      fontSizeRef.value = 3;

      initTheme();
      restoreContent();
      updateActiveStates();
      setSavedState("saved");
      updateCounter();
    }

    // Toolbar wiring (fixed)
    optionsButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        restoreSelection();
        writingArea.focus({ preventScroll: true });

        modifyText(btn.id, false, null);

        saveSelection();
        updateActiveStates();
        scheduleSave();
        updateCounter();
      });
    });

    advancedOptions.forEach(el => {
      el.addEventListener("change", () => {
        restoreSelection();
        writingArea.focus({ preventScroll: true });

        modifyText(el.id, false, el.value);

        saveSelection();
        scheduleSave();
        updateCounter();
      });
    });

    // Editor events
    writingArea.addEventListener("keyup", ()=>{ saveSelection(); updateActiveStates(); scheduleSave(); updateCounter(); });
    writingArea.addEventListener("mouseup", ()=>{ saveSelection(); updateActiveStates(); updateCounter(); });
    writingArea.addEventListener("input", ()=>{ saveSelection(); scheduleSave(); updateCounter(); });

    // Link
    linkButton.addEventListener("click", ()=>{
      saveSelection();
      let userLink = prompt("Enter a URL:");
      if(!userLink) return;
      if(!/^https?:\/\//i.test(userLink)) userLink = "https://" + userLink;
      restoreSelection();
      modifyText("createLink", false, userLink);
      writingArea.focus();
      scheduleSave();
    });

    // Theme
    themeToggle.addEventListener("click", ()=>{
      const isDark = document.body.classList.contains("dark");
      applyTheme(isDark ? "light" : "dark");
      showToast(isDark ? "Light mode" : "Dark mode");
    });

    // Copy
    $("#copyAll").addEventListener("click", async ()=>{
      const text = writingArea.innerText || "";
      if(!text.trim()) return showToast("Nothing to copy.");
      try{ await navigator.clipboard.writeText(text); showToast("Copied ✅"); }
      catch(e){ showToast("Copy blocked by browser."); }
    });

    // Downloads
    $("#downloadTxt").addEventListener("click", ()=>{
      download("document.txt", writingArea.innerText || "", "text/plain");
      showToast("Downloaded .txt");
    });

    $("#downloadHtml").addEventListener("click", ()=>{
      const html = writingArea.innerHTML || "";
      const full = `<!doctype html><html><head><meta charset="utf-8"></head><body>${html}</body></html>`;
      download("document.html", full, "text/html");
      showToast("Downloaded .html");
    });

    // Print
    $("#printPdf").addEventListener("click", ()=>{
      window.print();
    });

    // Clear
    $("#clearAll").addEventListener("click", ()=>{
      if(!confirm("Clear the editor?")) return;
      writingArea.innerHTML = "";
      scheduleSave();
      updateCounter();
      showToast("Cleared");
    });

    // Find/Replace modal
    findBtn.addEventListener("click", openModal);
    closeModal.addEventListener("click", closeModalFn);
    modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModalFn(); });

    findNextBtn.addEventListener("click", findNext);
    replaceOneBtn.addEventListener("click", replaceOne);
    replaceAllBtn.addEventListener("click", replaceAll);

    // Keyboard shortcuts
    document.addEventListener("keydown", (e)=>{
      const k = e.key.toLowerCase();
      const ctrl = e.ctrlKey || e.metaKey;

      if(ctrl && k === "b"){ e.preventDefault(); restoreSelection(); modifyText("bold", false, null); saveSelection(); updateActiveStates(); scheduleSave(); }
      if(ctrl && k === "i"){ e.preventDefault(); restoreSelection(); modifyText("italic", false, null); saveSelection(); updateActiveStates(); scheduleSave(); }
      if(ctrl && k === "u"){ e.preventDefault(); restoreSelection(); modifyText("underline", false, null); saveSelection(); updateActiveStates(); scheduleSave(); }
      if(ctrl && k === "k"){ e.preventDefault(); linkButton.click(); }
      if(ctrl && k === "f"){ e.preventDefault(); openModal(); }
      if(k === "escape" && modal.style.display === "grid"){ closeModalFn(); }
    });

    window.addEventListener("beforeunload", ()=> localStorage.setItem(STORAGE_KEY, writingArea.innerHTML));

    window.onload = initializer;
  </script>

  <!-- Security note: Avoid pasting sensitive data in a local editor if your PC is shared. -->
</body>
</html>
