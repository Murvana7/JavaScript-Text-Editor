<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23030712'/%3E%3Cpath d='M22 18v28' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M30 22h16M30 28h16M30 34h12' stroke='%2360a5fa' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <title>Online Text Editor</title>

</head>

<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <h2>Online Text Editor</h2>
        <div class="sub">Format • Links • Colors • Auto-save (local)</div>
      </div>

      <div class="right-tools">
        <div class="pill" id="saveState"><i class="fa-solid fa-floppy-disk"></i><span>Saved</span></div>

        <button id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>

        <button id="findBtn" title="Find / Replace (Ctrl+F)" aria-label="Find Replace">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <div class="pill" id="counterPill">
          <i class="fa-solid fa-align-left"></i>
          <span id="counterText">0 words • 0 chars</span>
        </div>

        <button id="copyAll" title="Copy all text" aria-label="Copy all">
          <i class="fa-solid fa-copy"></i>
        </button>

        <button id="downloadTxt" title="Download .txt" aria-label="Download txt">
          <i class="fa-solid fa-file-arrow-down"></i>
        </button>

        <button id="downloadHtml" title="Download .html" aria-label="Download html">
          <i class="fa-brands fa-html5"></i>
        </button>

        <button id="printPdf" title="Print / Save as PDF" aria-label="Print PDF">
          <i class="fa-solid fa-file-pdf"></i>
        </button>

        <button id="clearAll" title="Clear editor" aria-label="Clear editor">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="options">
      <button id="bold" class="option-button format" title="Bold" aria-label="Bold">
        <i class="fa-solid fa-bold"></i>
      </button>

      <button id="italic" class="option-button format" title="Italic" aria-label="Italic">
        <i class="fa-solid fa-italic"></i>
      </button>

      <button id="underline" class="option-button format" title="Underline" aria-label="Underline">
        <i class="fa-solid fa-underline"></i>
      </button>

      <button id="superscript" class="option-button script" title="Superscript">
        <i class="fa-solid fa-superscript"></i>
      </button>

      <button id="subscript" class="option-button script" title="Subscript">
        <i class="fa-solid fa-subscript"></i>
      </button>

      <button id="insertOrderedList" class="option-button list" title="Ordered list">
        <i class="fa-solid fa-list-ol"></i>
      </button>

      <button id="insertUnorderedList" class="option-button list" title="Unordered list">
        <i class="fa-solid fa-list-ul"></i>
      </button>

      <button id="undo" class="option-button" title="Undo">
        <i class="fa-solid fa-rotate-left"></i>
      </button>

      <button id="redo" class="option-button" title="Redo">
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <button id="createLink" class="adv-option-button" title="Insert link (Ctrl+K)">
        <i class="fa-solid fa-link"></i>
      </button>

      <button id="unlink" class="option-button" title="Remove link">
        <i class="fa-solid fa-unlink"></i>
      </button>

      <button id="justifyLeft" class="option-button align" title="Align left">
        <i class="fa-solid fa-align-left"></i>
      </button>

      <button id="justifyCenter" class="option-button align" title="Align center">
        <i class="fa-solid fa-align-center"></i>
      </button>

      <button id="justifyRight" class="option-button align" title="Align right">
        <i class="fa-solid fa-align-right"></i>
      </button>

      <button id="justifyFull" class="option-button align" title="Justify">
        <i class="fa-solid fa-align-justify"></i>
      </button>

      <button id="indent" class="option-button spacing" title="Indent">
        <i class="fa-solid fa-indent"></i>
      </button>

      <button id="outdent" class="option-button spacing" title="Outdent">
        <i class="fa-solid fa-outdent"></i>
      </button>

      <select id="formatBlock" class="adv-option-button" title="Heading">
        <option value="P">P</option>
        <option value="H1">H1</option>
        <option value="H2">H2</option>
        <option value="H3">H3</option>
        <option value="H4">H4</option>
        <option value="H5">H5</option>
        <option value="H6">H6</option>
      </select>

      <select id="fontName" class="adv-option-button" title="Font"></select>
      <select id="fontSize" class="adv-option-button" title="Size"></select>

      <div class="input-wrapper" title="Font color">
        <input type="color" id="foreColor" class="adv-option-button" value="#000000">
        <label for="foreColor">Font</label>
      </div>

      <div class="input-wrapper" title="Highlight color">
        <input type="color" id="backColor" class="adv-option-button" value="#ffff00">
        <label for="backColor">Highlight</label>
      </div>
    </div>

    <div id="text-input" contenteditable="true"></div>
  </div>

  <!-- Find & Replace Modal -->
  <div id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Find and replace">
      <div class="modal-head">
        <b>Find & Replace</b>
        <button id="closeModal" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-grid">
        <input id="findInput" class="modal-input" placeholder="Find…">
        <input id="replaceInput" class="modal-input" placeholder="Replace with…">

        <label style="display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;">
          <input id="matchCase" type="checkbox" style="width:16px;height:16px;accent-color:var(--accent);">
          Match case
        </label>

        <div class="modal-actions">
          <button id="findNext" class="wide-btn">Find next</button>
          <button id="replaceOne" class="wide-btn">Replace</button>
          <button id="replaceAll" class="wide-btn primary-wide">Replace all</button>
        </div>
      </div>

      <p class="modal-note">
        Shortcuts: <b>Ctrl+F</b> Find • <b>Ctrl+K</b> Link • <b>Ctrl+B</b> Bold • <b>Ctrl+I</b> Italic • <b>Ctrl+U</b> Underline • <b>Esc</b> Close
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="index.js"></script>
  <!-- Security note: Avoid pasting sensitive data in a local editor if your PC is shared. -->
</body>
</html>
